<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Developer at a desk with two monitors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scr1"><rect x="458" y="78" width="144" height="88" rx="3"/></clipPath>
    <clipPath id="scr2"><rect x="638" y="78" width="154" height="88" rx="3"/></clipPath>
  </defs>

  <rect width="900" height="330" rx="14" fill="url(#bg)"/>

  <!-- left text -->
  <g font-family="Fira Code, Consolas, monospace">
    <text x="50" y="108" font-size="14" fill="#7EE787" opacity="0.9">// code. ship. repeat
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="158" font-size="34" font-weight="700" fill="#F5A623">Backend Developer</text>
    <text x="50" y="192" font-size="20" fill="#e6edf3">Full-Stack · AI/ML</text>
    <text x="50" y="226" font-size="14" fill="#9fb3c0">Node.js · TypeScript · Prisma · PostgreSQL</text>
    <rect x="50" y="244" width="8" height="16" fill="#7EE787">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating symbols -->
  <g font-family="Fira Code, Consolas, monospace" font-size="18" fill="#38bdf8" opacity="0.6">
    <text x="420" y="60">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="830" y="70" fill="#F5A623">{ }
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="200" fill="#7EE787">;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="850" y="190">#
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- screen glow on desk -->
  <ellipse cx="625" cy="236" rx="210" ry="14" fill="url(#glow)"/>

  <!-- left monitor -->
  <rect x="450" y="70" width="160" height="104" rx="6" fill="#0b1820" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="458" y="78" width="144" height="88" rx="3" fill="#0d1117"/>
  <g clip-path="url(#scr1)">
    <rect x="466" y="88" height="5" rx="2" fill="#F5A623"><animate attributeName="width" values="0;40;40;0" keyTimes="0;0.2;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="474" y="100" height="5" rx="2" fill="#38bdf8"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.3;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="474" y="112" height="5" rx="2" fill="#7EE787"><animate attributeName="width" values="0;60;60;0" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="482" y="124" height="5" rx="2" fill="#c792ea"><animate attributeName="width" values="0;90;90;0" keyTimes="0;0.5;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="474" y="136" height="5" rx="2" fill="#38bdf8"><animate attributeName="width" values="0;50;50;0" keyTimes="0;0.6;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="466" y="148" height="5" rx="2" fill="#F5A623"><animate attributeName="width" values="0;30;30;0" keyTimes="0;0.7;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="500" y="146" width="5" height="9" fill="#7EE787"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="522" y="174" width="16" height="50" fill="#16323f"/>
  <rect x="498" y="222" width="64" height="8" rx="3" fill="#16323f"/>

  <!-- right monitor -->
  <rect x="630" y="70" width="170" height="104" rx="6" fill="#0b1820" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="638" y="78" width="154" height="88" rx="3" fill="#0d1117"/>
  <g clip-path="url(#scr2)">
    <g fill="#38bdf8" opacity="0.8">
      <rect x="650" y="140" width="12" height="18"><animate attributeName="height" values="6;18;6" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="152;140;152" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="668" y="130" width="12" height="28"><animate attributeName="height" values="28;10;28" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="130;148;130" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="686" y="120" width="12" height="38"><animate attributeName="height" values="14;38;14" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="144;120;144" dur="3.4s" repeatCount="indefinite"/></rect>
    </g>
    <polyline points="650,128 690,110 720,122 750,96 780,104" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;0.5;0.9;1" dur="5s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="780" cy="104" r="3.5" fill="#F5A623">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.9;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <rect x="650" y="88" width="50" height="4" rx="2" fill="#7EE787" opacity="0.8"/>
    <rect x="650" y="97" width="30" height="4" rx="2" fill="#9fb3c0" opacity="0.5"/>
  </g>
  <rect x="707" y="174" width="16" height="50" fill="#16323f"/>
  <rect x="683" y="222" width="64" height="8" rx="3" fill="#16323f"/>

  <!-- desk -->
  <rect x="410" y="230" width="480" height="10" rx="3" fill="#16323f"/>
  <rect x="410" y="238" width="480" height="92" fill="#0b1820" opacity="0.6"/>

  <!-- developer from behind -->
  <path d="M566 330 Q570 268 625 258 Q680 268 684 330 Z" fill="#12303d" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="613" y="244" width="24" height="16" fill="#12303d"/>
  <circle cx="625" cy="232" r="21" fill="#12303d" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M602 232 A23 23 0 0 1 648 232" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  <circle cx="602" cy="234" r="7" fill="#F5A623"/>
  <circle cx="648" cy="234" r="7" fill="#F5A623"/>

  <!-- coffee -->
  <rect x="760" y="214" width="16" height="16" rx="3" fill="#e6edf3"/>
  <path d="M776 218 q8 0 8 6 q0 6 -8 6" fill="none" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M764 208 q-3 -5 0 -9 q3 -4 0 -8" fill="none" stroke="#9fb3c0" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>
